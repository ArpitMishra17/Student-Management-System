{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Display Students</title>
    <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body>
    <h1>Registered Students</h1>
    

    <form id="search-form" role="search" class="search-container">
        <input type="text" id="search-input" name="q" value="{{ q }}" placeholder="Search students by name..." autocomplete="off">
        <button type="submit">Search</button>
    </form>

    <div id="students-wrapper">
        {% include '_students_table.html' %}
    </div>
    
    <div class="button-container">
        <a href="{% url 'home' %}">Back to Home</a>
    </div>

    <!--ajax modal-->
    <div id="updateModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Update Student</h2>
            <form id="updateForm">
                {% csrf_token %}
                <input type="hidden" id="student-id">
                <label for="name">Name:</label>
                <input type="text" id="name" name="student_name"><br>
                <label for="age">Age:</label>
                <input type="number" id="age" name="student_age"><br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="student_email"><br>
                <label for="phone">Phone number:</label>
                <input type="text" id="phone" name="student_phone"><br><br>
                <button type="submit">Update</button>
            </form>
        </div>
    </div>
    <script>
        const modal = document.getElementById("updateModal");
        const closeBtn = document.querySelector(".close-btn");
        const updateForm = document.getElementById("updateForm");
        const wrapper = document.getElementById("students-wrapper");
        const searchInput = document.getElementById("search-input");
        const searchForm = document.getElementById("search-form");

        // Bind Update/Delete handlers to the rows currently in the table.
        // Called on load and again after each AJAX search swap so freshly
        // rendered rows behave identically to the server-rendered ones.
        function bindRowButtons() {
            document.querySelectorAll(".update-button").forEach(button => {
                button.addEventListener("click", function() {
                    document.getElementById("student-id").value = this.dataset.id;
                    document.getElementById("name").value = this.dataset.name;
                    document.getElementById("age").value = this.dataset.age;
                    document.getElementById("email").value = this.dataset.email;
                    document.getElementById("phone").value = this.dataset.phone;
                    modal.style.display = "block";
                });
            });

            document.querySelectorAll(".delete-button").forEach(button => {
                button.addEventListener("click", function () {
                    const studentId = this.dataset.id;

                    if (!confirm("Are you sure you want to delete this student?")) {
                        return;
                    }

                    const csrfToken = document.querySelector('[name="csrfmiddlewaretoken"]').value;

                    fetch("{% url 'delete_student' 0 %}".replace('0', studentId), {
                        method: "POST",
                        headers: {
                            "X-CSRFToken": csrfToken,
                            "Content-Type": "application/json"
                        }
                    })
                    .then(response => {
                        if (response.ok) {
                            button.closest("tr").remove();
                            alert("Student deleted successfully!");
                        } else {
                            throw new Error("Failed to delete the student.");
                        }
                    })
                    .catch(error => {
                        console.error("Error:", error);
                        alert("An error occurred while trying to delete the student.");
                    });
                });
            });
        }

        // Modal close handlers (bound once — the modal persists across swaps).
        closeBtn.addEventListener("click", function() {
            modal.style.display = "none";
        });

        window.addEventListener("click", function(event) {
            if (event.target === modal) {
                modal.style.display = "none";
            }
        });

        // Update form submit (XHR to update_student_ajax).
        updateForm.addEventListener("submit", function(e) {
            e.preventDefault();

            const formData = new FormData();
            formData.append("student_id", document.getElementById("student-id").value);
            formData.append("name", document.getElementById("name").value);
            formData.append("age", document.getElementById("age").value);
            formData.append("email", document.getElementById("email").value);
            formData.append("phone", document.getElementById("phone").value);
            formData.append("csrfmiddlewaretoken", document.querySelector('[name="csrfmiddlewaretoken"]').value);

            const request = new XMLHttpRequest();
            request.open("POST", "{% url 'update_student_ajax' %}", true);
            request.onreadystatechange = function() {
                if (request.readyState === XMLHttpRequest.DONE) {
                    if (request.status === 200) {
                        const response = JSON.parse(request.responseText);
                        if (response.success) {
                            alert("Student details updated successfully");
                            window.location.reload();
                        } else {
                            alert("Error updating student details");
                        }
                    } else {
                        alert("Error occurred while updating student");
                    }
                }
            };
            request.send(formData);
        });

        // Inline name search: fetch the filtered table fragment and swap it in.
        let searchTimer = null;
        function performSearch() {
            const q = searchInput.value.trim();
            const url = "{% url 'search_students' %}?q=" + encodeURIComponent(q);
            fetch(url)
                .then(response => response.text())
                .then(html => {
                    wrapper.innerHTML = html;
                    bindRowButtons();
                })
                .catch(error => console.error("Search failed:", error));
        }

        searchInput.addEventListener("input", function() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(performSearch, 300);
        });

        searchForm.addEventListener("submit", function(e) {
            e.preventDefault();
            performSearch();
        });

        // Initial bind for the server-rendered rows.
        bindRowButtons();
    </script>
</body>
</html>
